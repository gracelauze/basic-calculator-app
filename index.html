<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./calculator.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <div id="answer-box">
      <p id="answer-display"></p>
    </div>
    <div id="calc-body">
      <button type="button" class="but-number" data-action="1">1</button>
      <button type="button" class="but-number" data-action="2">2</button>
      <button type="button" class="but-number" data-action="3">3</button>
      <button type="button" class="but-number" data-action="4">4</button>
      <button type="button" class="but-number" data-action="5">5</button>
      <button type="button" class="but-number" data-action="6">6</button>
      <button type="button" class="but-number" data-action="7">7</button>
      <button type="button" class="but-number" data-action="8">8</button>
      <button type="button" class="but-number" data-action="9">9</button>
      <button type="button" class="but-number" data-action="0">0</button>
      <button type="button" class="but-op" data-action="+">+</button>
      <button type="button" class="but-op" data-action="-">-</button>
      <button type="button" class="but-op" data-action="=">=</button>
      <button type="button" class="but-op" data-action="x">x</button>
      <button type="button" class="but-op" data-action="/">/</button>
      <button type="button" id="b-clear" class="but-op" data-action="clear">
        clear
      </button>
    </div>
  </body>
</html>
